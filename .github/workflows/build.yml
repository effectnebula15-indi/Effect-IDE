name: build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка, тесты, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK нужен даже для десктопных задач: без него AGP не сконфигурирует
      # проект целиком, а модули Android входят в тот же билд.
      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Пакеты SDK и NDK
        run: |
          sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Сборка, тесты, lint и проверка границ модулей
        run: ./gradlew build checkArchitecture --stacktrace

      # Отдельным шагом: нативный код гоняется под санитайзерами на хосте, а не
      # только едет в APK. Ошибки в нём не воспроизводятся по требованию, и
      # ловить их на телефоне — самый дорогой способ.
      - name: Нативный код под санитайзерами
        run: ./gradlew checkNative --stacktrace

      - name: APK для проверки на устройстве
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: effect-ide-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Отчёты при падении
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
